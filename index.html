<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMS Assessment - Movivo</title>
    <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
    <script defer src="https://pyscript.net/latest/pyscript.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        #videoFeed {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }
        #videoFrame {
            max-width: 100%;
            height: auto;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        #status {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>FMS Assessment - Video Feed</h1>
    <div id="videoFeed">
        <img id="videoFrame" src="" alt="Video Feed" />
    </div>
    <div id="status">Loading video feed...</div>

    <py-script src="app.py"></py-script>
</body>
</html>
